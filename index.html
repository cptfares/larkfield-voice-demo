<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Call Adam · Larkfield Heating & Air</title>
<meta name="description" content="Call Adam, the front desk at Larkfield Heating & Air, from your browser. A demo with a made-up company.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;500;600&family=Source+Serif+4:opsz,wght@8..60,600&display=swap" rel="stylesheet">
<style>
  :root { --paper: #f5f2ec; --ink: #1b1f24; --muted: #6b7178; --call: #2e7d4f; --hang: #c0392b; }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) { --paper: #141619; --ink: #ecebe7; --muted: #9aa0a6; --call: #3f9d66; --hang: #d9534a; }
  }
  :root[data-theme="dark"] { --paper: #141619; --ink: #ecebe7; --muted: #9aa0a6; --call: #3f9d66; --hang: #d9534a; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    background: var(--paper); color: var(--ink); font: 16px/1.5 "Public Sans", system-ui, -apple-system, sans-serif;
    -webkit-font-smoothing: antialiased; font-variant-numeric: tabular-nums;
    display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 24px 16px 64px;
  }
  .who { font-family: "Source Serif 4", Georgia, serif; font-weight: 600; font-size: 30px; letter-spacing: -.01em; line-height: 1.15; margin: 0; }
  .role { color: var(--muted); margin: 6px 0 0; }
  .state { margin: 40px 0 28px; min-height: 48px; }
  #statusText { font-size: 17px; }
  #sub { color: var(--muted); font-size: 14px; margin-top: 2px; min-height: 21px; }
  .key { width: 84px; height: 84px; border-radius: 50%; border: 0; cursor: pointer; background: var(--call); color: #fff; display: grid; place-items: center; margin: 0 auto; transition: background .2s ease, transform .1s ease; }
  .key:active { transform: scale(.96); }
  .key:focus-visible { outline: 3px solid var(--ink); outline-offset: 4px; }
  .key[disabled] { opacity: .7; cursor: progress; }
  .key svg { width: 34px; height: 34px; transition: transform .2s ease; }
  .in-call .key { background: var(--hang); }
  .in-call .key svg { transform: rotate(135deg); }
  .key-label { margin-top: 12px; font-size: 14px; color: var(--muted); }
  .error { color: var(--hang); }
  footer { position: fixed; bottom: 16px; left: 16px; right: 16px; font-size: 12.5px; color: var(--muted); }
</style>
</head>
<body>
  <main id="call">
    <h1 class="who">Larkfield Heating &amp; Air</h1>
    <p class="role">Adam · front desk</p>
    <div class="state" aria-live="polite">
      <div id="statusText">Ready to call</div>
      <div id="sub"></div>
    </div>
    <button class="key" id="callBtn" type="button" aria-label="Call">
      <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M6.6 10.8a15.1 15.1 0 0 0 6.6 6.6l2.2-2.2a1 1 0 0 1 1-.25 11.4 11.4 0 0 0 3.6.57 1 1 0 0 1 1 1V20a1 1 0 0 1-1 1A17 17 0 0 1 3 4a1 1 0 0 1 1-1h3.5a1 1 0 0 1 1 1c0 1.25.2 2.45.57 3.57a1 1 0 0 1-.25 1z"/></svg>
    </button>
    <div class="key-label" id="keyLabel">Call</div>
  </main>
  <footer>Demo with a made-up company. Adam is an AI voice agent. Please use made-up details.</footer>

<script src="https://cdn.jsdelivr.net/npm/livekit-client@2.22.4/dist/livekit-client.umd.js"></script>
<script>
  // LiveKit Cloud development token server (project setting); fine for a demo on a capped plan.
  const TOKEN_SERVER_ID = "voiceagent-21hutv";
  const AGENT_NAME = "hvac-receptionist";
  const MAX_CALL_SECONDS = 300;
  // Plain link: Kelly on OpenAI gpt-realtime (speech-to-speech). ?live: Gemini Live.
  // ?classic: the older Deepgram + GPT-4.1 + ElevenLabs Kelly.
  const params = new URLSearchParams(location.search);
  const ROOM_PREFIX = params.has("live") ? "larkfield-live-" : params.has("classic") ? "larkfield-demo-" : "larkfield-gpt-";
  // Adam sleeps when nobody has called for a while; wake him while the page is open.
  fetch("https://larkfield-admin.fly.dev/api/wake", { method: "POST", mode: "no-cors", keepalive: true }).catch(() => {});

  const { Room, RoomEvent, Track, TokenSource } = LivekitClient;
  const $ = (id) => document.getElementById(id);
  const callEl = $("call"), callBtn = $("callBtn"), keyLabel = $("keyLabel"), statusText = $("statusText"), sub = $("sub");
  const tokenSource = TokenSource.developmentTokenServer(TOKEN_SERVER_ID);
  let room = null, timer = null, startedAt = 0, answered = false;

  const mmss = (s) => `${Math.floor(s / 60)}:${String(s % 60).padStart(2, "0")}`;

  function idle(message, detail = "") {
    callEl.classList.remove("in-call");
    callBtn.disabled = false; callBtn.setAttribute("aria-label", "Call"); keyLabel.textContent = "Call";
    statusText.textContent = message || "Ready to call";
    sub.textContent = detail;
    clearInterval(timer); timer = null;
  }

  function tick() {
    const s = Math.round((Date.now() - startedAt) / 1000);
    sub.textContent = mmss(s);
    if (s >= MAX_CALL_SECONDS) hangUp("Call ended", "Demo calls end after 5 minutes.");
  }

  function answer() {
    if (answered || !room) return;
    answered = true;
    statusText.textContent = "Adam";
    startedAt = Date.now(); timer = setInterval(tick, 1000); tick();
  }

  async function call() {
    callBtn.disabled = true;
    statusText.textContent = "Calling…";
    sub.textContent = "Allow the microphone if your browser asks.";
    try {
      const { serverUrl, participantToken } = await tokenSource.fetch({
        roomName: `${ROOM_PREFIX}${crypto.randomUUID().slice(0, 8)}`, participantName: "Demo caller", agentName: AGENT_NAME,
      });
      room = new Room({ adaptiveStream: true, dynacast: true });
      answered = false;
      room.on(RoomEvent.TrackSubscribed, (track) => {
        if (track.kind !== Track.Kind.Audio) return;
        document.body.appendChild(track.attach());
        answer();
      });
      room.on(RoomEvent.Disconnected, () => { room = null; idle("Call ended"); });
      await room.connect(serverUrl, participantToken);
      await room.localParticipant.setMicrophoneEnabled(true);
      await room.startAudio();
      callEl.classList.add("in-call");
      callBtn.disabled = false; callBtn.setAttribute("aria-label", "Hang up"); keyLabel.textContent = "Hang up";
      if (!answered) { statusText.textContent = "Ringing…"; sub.textContent = ""; }
    } catch (err) {
      console.error(err);
      const denied = err && (err.name === "NotAllowedError" || /permission/i.test(err.message));
      await hangUp();
      idle(denied ? "Microphone blocked" : "Couldn't connect");
      sub.innerHTML = `<span class="error">${denied ? "Allow the microphone for this page, then try again." : "Please try again in a moment."}</span>`;
    }
  }

  async function hangUp(message, detail) {
    const r = room; room = null;
    if (r) await r.disconnect();
    if (message) idle(message, detail);
  }

  callBtn.addEventListener("click", () => (room ? hangUp("Call ended") : call()));
  window.addEventListener("beforeunload", () => room?.disconnect());
</script>
</body>
</html>
